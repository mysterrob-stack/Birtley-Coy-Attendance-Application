<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Roll Call</title>
<link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Roll%20Call%22,%22short_name%22:%22Roll%20Call%22,%22display%22:%22standalone%22,%22start_url%22:%22.%22,%22background_color%22:%22%2326362F%22,%22theme_color%22:%22%2326362F%22}" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Roll Call" />
<meta name="theme-color" content="#26362F" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --board:#26362F; --board-dark:#1E2B25; --card:#FBF8F1; --card-shadow:rgba(0,0,0,0.35);
  --chalk:#EFEBDD; --chalk-dim:#B9C4BB; --pin:#C8503F; --stamp-green:#3E7A52; --stamp-green-bg:#E4EFE6;
  --stamp-red:#BC4A3C; --stamp-red-bg:#F4E4E1; --amber:#E0A63A; --muted:#8a8375;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--board); min-height:100vh; font-family:'Inter',sans-serif;
  -webkit-tap-highlight-color:transparent;
}
button, input{font-family:inherit;}
.header{background:var(--board-dark); border-bottom:1px solid rgba(239,235,221,0.15); padding:24px 16px 16px;}
.header-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.logo{font-family:'Big Shoulders Display',sans-serif; color:var(--chalk); letter-spacing:0.02em; font-size:28px; font-weight:800; text-transform:uppercase; margin:0;}
.name-chip{display:flex; align-items:center; gap:6px; background:var(--card); color:var(--board-dark); border:none; border-radius:999px; padding:7px 14px; font-size:14px; font-weight:500; cursor:pointer;}
.name-chip span{font-family:'IBM Plex Mono',monospace;}
.month-nav{display:flex; align-items:center; justify-content:space-between;}
.month-nav button{background:none; border:none; color:var(--chalk); padding:8px; cursor:pointer;}
.month-label{font-family:'IBM Plex Mono',monospace; color:var(--chalk-dim); font-size:13px; letter-spacing:0.15em; text-transform:uppercase;}

.cal-wrap{padding:16px 12px 0;}
.dow-row{display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:4px;}
.dow{text-align:center; color:var(--chalk-dim); font-family:'IBM Plex Mono',monospace; font-size:12px; padding:4px 0;}
.day-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
.day-cell{aspect-ratio:1; border-radius:10px; border:1px solid transparent; background:transparent; color:var(--chalk); display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; cursor:pointer; font-size:14px;}
.day-cell span.num{font-family:'IBM Plex Mono',monospace;}
.day-cell.today{border-color:var(--amber);}
.day-cell.selected{background:var(--card); color:var(--board-dark);}
.day-dot{position:absolute; bottom:5px; width:6px; height:6px; border-radius:50%; background:var(--amber);}
.day-cell.selected .day-dot{background:var(--pin);}

.panel{padding:24px 16px 96px;}
.panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
.panel-date{font-family:'IBM Plex Mono',monospace; color:var(--chalk-dim); font-size:12px; text-transform:uppercase; letter-spacing:0.15em;}
.new-btn{display:flex; align-items:center; gap:5px; color:var(--amber); border:1px solid var(--amber); background:none; border-radius:999px; padding:6px 12px; font-size:12px; font-weight:600; cursor:pointer;}
.empty{border:1px dashed rgba(239,235,221,0.25); border-radius:12px; padding:24px; text-align:center; color:var(--chalk-dim); font-size:14px;}

.event-card{background:var(--card); border-radius:8px; padding:16px; position:relative; box-shadow:0 6px 14px var(--card-shadow); margin-bottom:16px;}
.event-card:nth-child(odd){transform:rotate(-0.6deg);}
.event-card:nth-child(even){transform:rotate(0.6deg);}
.pin-dot{position:absolute; top:-8px; left:50%; transform:translateX(-50%) rotate(-10deg); width:14px; height:14px; border-radius:50%; background:var(--pin);}
.event-title-row{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
.event-title{font-family:'Big Shoulders Display',sans-serif; color:var(--board-dark); font-size:21px; font-weight:700; margin:0; line-height:1.15;}
.event-time{font-family:'IBM Plex Mono',monospace; color:var(--muted); font-size:12px; margin:4px 0 12px;}
.rsvp-row{display:flex; gap:8px; margin:8px 0 12px;}
.rsvp-btn{flex:1; display:flex; align-items:center; justify-content:center; gap:5px; border-radius:999px; padding:9px 0; font-size:14px; font-weight:600; cursor:pointer; border-width:1.5px; border-style:solid;}
.rsvp-btn.attend{background:var(--stamp-green-bg); color:var(--stamp-green); border-color:var(--stamp-green);}
.rsvp-btn.attend.active{background:var(--stamp-green); color:#fff;}
.rsvp-btn.notattend{background:var(--stamp-red-bg); color:var(--stamp-red); border-color:var(--stamp-red);}
.rsvp-btn.notattend.active{background:var(--stamp-red); color:#fff;}
.rsvp-lists{border-top:1px solid rgba(0,0,0,0.08); padding-top:8px;}
.rsvp-lists p{margin:2px 0; font-size:12px; font-weight:500;}
.rsvp-lists .att{color:var(--stamp-green);}
.rsvp-lists .not{color:var(--stamp-red);}

.overlay{position:fixed; inset:0; background:rgba(0,0,0,0.55); display:flex; align-items:flex-end; justify-content:center; z-index:50;}
.overlay.center{align-items:center; padding:0 24px;}
.sheet{background:var(--card); width:100%; max-width:420px; border-radius:16px 16px 0 0; padding:20px; padding-bottom:32px;}
.overlay.center .sheet{border-radius:16px; padding:24px;}
.sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.sheet-title{font-family:'Big Shoulders Display',sans-serif; color:var(--board-dark); font-size:24px; font-weight:700; margin:0;}
.sheet-close{background:none; border:none; color:var(--muted); cursor:pointer; padding:4px;}
.field-label{color:var(--muted); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; display:block; margin-bottom:4px;}
.field-input{width:100%; border:1px solid rgba(0,0,0,0.15); border-radius:8px; padding:10px 12px; font-size:14px; color:var(--board-dark); outline:none; margin-bottom:14px;}
.field-static{font-family:'IBM Plex Mono',monospace; color:var(--board-dark); font-size:14px; margin:0 0 14px;}
.checkbox-row{display:flex; align-items:center; gap:8px; margin-bottom:14px; font-size:14px; color:var(--board-dark);}
.primary-btn{width:100%; border:none; border-radius:999px; padding:13px 0; font-size:14px; font-weight:600; background:var(--board-dark); color:var(--chalk); cursor:pointer;}
.primary-btn:disabled{opacity:0.5;}
.secondary-btn{flex:1; border:1px solid rgba(0,0,0,0.15); border-radius:999px; padding:11px 0; font-size:14px; font-weight:500; background:none; color:var(--muted); cursor:pointer;}
.btn-row{display:flex; gap:8px;}
.sub-note{color:var(--muted); font-size:13px; margin:0 0 16px;}
.error-text{color:var(--stamp-red); font-size:12px; text-align:center; margin-top:12px;}
.loading-text{color:var(--chalk-dim); font-size:14px;}
.setup-banner{background:#3a2a1f; border:1px solid var(--amber); color:var(--chalk); font-size:12px; padding:10px 14px; margin:16px; border-radius:8px; line-height:1.5;}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1 class="logo">Roll Call</h1>
    <button class="name-chip" id="nameChip"><span id="nameChipText">Set name</span></button>
  </div>
  <div class="month-nav">
    <button id="prevMonth" aria-label="Previous month">&#8592;</button>
    <span class="month-label" id="monthLabel"></span>
    <button id="nextMonth" aria-label="Next month">&#8594;</button>
  </div>
</div>

<div class="cal-wrap">
  <div class="dow-row" id="dowRow"></div>
  <div class="day-grid" id="dayGrid"></div>
</div>

<div class="panel">
  <div class="panel-head">
    <span class="panel-date" id="panelDate"></span>
    <button class="new-btn" id="newEventBtn">+ New event</button>
  </div>
  <div id="eventsList"></div>
</div>

<div id="formOverlay" class="overlay" style="display:none;">
  <div class="sheet">
    <div class="sheet-head">
      <h2 class="sheet-title">New Event</h2>
      <button class="sheet-close" id="closeFormBtn">&#10005;</button>
    </div>
    <label class="field-label">Title</label>
    <input class="field-input" id="formTitle" placeholder="Team practice" />
    <label class="field-label">Date</label>
    <p class="field-static" id="formDateLabel"></p>
    <label class="field-label">Time (optional)</label>
    <input class="field-input" id="formTime" type="time" />
    <label class="checkbox-row"><input type="checkbox" id="formRepeat" /> Repeats weekly</label>
    <div id="formUntilWrap" style="display:none;">
      <label class="field-label">Until</label>
      <input class="field-input" id="formUntil" type="date" />
    </div>
    <button class="primary-btn" id="submitFormBtn">Add to board</button>
  </div>
</div>

<div id="nameOverlay" class="overlay center" style="display:none;">
  <div class="sheet">
    <h2 class="sheet-title" style="margin-bottom:4px;">Who's marking attendance?</h2>
    <p class="sub-note">Your name shows up next to your RSVPs so the group knows who's in.</p>
    <input class="field-input" id="nameInput" placeholder="Your name" />
    <div class="btn-row">
      <button class="secondary-btn" id="nameCancelBtn" style="display:none;">Cancel</button>
      <button class="primary-btn" id="nameSaveBtn">Save</button>
    </div>
  </div>
</div>

<!-- ============================================================= -->
<!-- FIREBASE SETUP: paste your project config below. See README.  -->
<!-- ============================================================= -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

const SETUP_NEEDED = firebaseConfig.apiKey === "YOUR_API_KEY";
let db = null;
if (!SETUP_NEEDED) {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
}
</script>
<script>
const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAY_NAMES = ["M","T","W","T","F","S","S"];

function pad(n){ return n < 10 ? "0"+n : ""+n; }
function toISODate(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function todayISO(){ return toISODate(new Date()); }

let myName = localStorage.getItem("rollcall-name") || "";
let events = [];
let viewDate = new Date();
let selectedDate = todayISO();
let rsvpCache = {};
const rsvpUnsubs = {};

function generateWeeklyDates(startISO, untilISO){
  const dates = [];
  let cur = new Date(startISO+"T00:00:00");
  const end = new Date(untilISO+"T00:00:00");
  let guard = 0;
  while (cur <= end && guard < 104){
    dates.push(toISODate(cur));
    cur.setDate(cur.getDate()+7);
    guard++;
  }
  return dates;
}

function updateNameChip(){
  document.getElementById("nameChipText").textContent = myName || "Set name";
}

function eventsForDate(iso){
  return events.filter(e => e.date === iso).sort((a,b) => (a.time||"").localeCompare(b.time||""));
}

function renderCalendar(){
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  document.getElementById("monthLabel").textContent = `${MONTH_NAMES[month]} ${year}`;

  const dowRow = document.getElementById("dowRow");
  dowRow.innerHTML = DAY_NAMES.map(d => `<div class="dow">${d}</div>`).join("");

  const firstOfMonth = new Date(year, month, 1);
  const startWeekday = (firstOfMonth.getDay() + 6) % 7; // Monday = 0
  const daysInMonth = new Date(year, month+1, 0).getDate();

  const eventCountByDate = {};
  events.forEach(e => { eventCountByDate[e.date] = (eventCountByDate[e.date]||0)+1; });

  let html = "";
  for (let i=0;i<startWeekday;i++) html += `<div></div>`;
  for (let d=1; d<=daysInMonth; d++){
    const iso = `${year}-${pad(month+1)}-${pad(d)}`;
    const isSelected = iso === selectedDate;
    const isToday = iso === todayISO();
    const count = eventCountByDate[iso] || 0;
    let cls = "day-cell";
    if (isSelected) cls += " selected";
    else if (isToday) cls += " today";
    html += `<button class="${cls}" data-date="${iso}"><span class="num">${d}</span>${count>0?'<span class="day-dot"></span>':''}</button>`;
  }
  document.getElementById("dayGrid").innerHTML = html;
  document.querySelectorAll(".day-cell").forEach(el => {
    el.addEventListener("click", () => {
      selectedDate = el.getAttribute("data-date");
      renderCalendar();
      renderDayPanel();
    });
  });
}

function renderDayPanel(){
  const selDateObj = new Date(selectedDate+"T00:00:00");
  document.getElementById("panelDate").textContent = `${MONTH_NAMES[selDateObj.getMonth()]} ${selDateObj.getDate()}, ${selDateObj.getFullYear()}`;
  document.getElementById("formDateLabel").textContent = `${MONTH_NAMES[selDateObj.getMonth()]} ${selDateObj.getDate()}, ${selDateObj.getFullYear()}`;

  const list = eventsForDate(selectedDate);
  const container = document.getElementById("eventsList");

  if (list.length === 0){
    container.innerHTML = `<div class="empty">Nothing on the board for this day.</div>`;
    return;
  }

  container.innerHTML = list.map(ev => {
    watchRsvps(ev.id);
    const rsvps = rsvpCache[ev.id] || {};
    const myStatus = myName ? rsvps[myName] : null;
    const attending = Object.entries(rsvps).filter(([,s]) => s === "attending").map(([n]) => n);
    const notAttending = Object.entries(rsvps).filter(([,s]) => s === "not-attending").map(([n]) => n);
    return `
      <div class="event-card">
        <div class="pin-dot"></div>
        <div class="event-title-row">
          <h3 class="event-title">${escapeHtml(ev.title)}</h3>
        </div>
        ${ev.time ? `<p class="event-time">${ev.time}</p>` : '<div style="height:8px;"></div>'}
        <div class="rsvp-row">
          <button class="rsvp-btn attend ${myStatus==='attending'?'active':''}" data-event="${ev.id}" data-status="attending">&#10003; Attending</button>
          <button class="rsvp-btn notattend ${myStatus==='not-attending'?'active':''}" data-event="${ev.id}" data-status="not-attending">&#10005; Not attending</button>
        </div>
        <div class="rsvp-lists">
          <p class="att">Attending (${attending.length})${attending.length?': '+escapeHtml(attending.join(", ")):''}</p>
          <p class="not">Not attending (${notAttending.length})${notAttending.length?': '+escapeHtml(notAttending.join(", ")):''}</p>
        </div>
      </div>
    `;
  }).join("");

  container.querySelectorAll(".rsvp-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      if (!myName){ showNameOverlay(true); return; }
      setRsvp(btn.getAttribute("data-event"), btn.getAttribute("data-status"));
    });
  });
}

function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

// --- Firestore wiring ---
function loadEventsRealtime(){
  if (!db) return;
  db.collection("events").orderBy("date").onSnapshot(snapshot => {
    events = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    renderCalendar();
    renderDayPanel();
  }, err => console.error("events listener error", err));
}

function watchRsvps(eventId){
  if (!db || rsvpUnsubs[eventId]) return;
  rsvpUnsubs[eventId] = db.collection("rsvps").doc(eventId).onSnapshot(doc => {
    rsvpCache[eventId] = doc.exists ? (doc.data().responses || {}) : {};
    renderDayPanel();
  }, err => console.error("rsvp listener error", err));
}

async function setRsvp(eventId, status){
  if (!db) return;
  const docRef = db.collection("rsvps").doc(eventId);
  const fieldPath = new firebase.firestore.FieldPath("responses", myName);
  try {
    await docRef.update(fieldPath, status);
  } catch (e) {
    await docRef.set({ responses: { [myName]: status } }, { merge: true });
  }
}

async function addEventsBatch(newEvents){
  if (!db) return;
  const batch = db.batch();
  newEvents.forEach(ev => {
    const ref = db.collection("events").doc();
    batch.set(ref, ev);
  });
  await batch.commit();
}

// --- UI wiring ---
function showNameOverlay(cancellable){
  document.getElementById("nameInput").value = myName;
  document.getElementById("nameCancelBtn").style.display = cancellable && myName ? "block" : "none";
  document.getElementById("nameOverlay").style.display = "flex";
  document.getElementById("nameInput").focus();
}
function hideNameOverlay(){ document.getElementById("nameOverlay").style.display = "none"; }

document.getElementById("nameChip").addEventListener("click", () => showNameOverlay(true));
document.getElementById("nameCancelBtn").addEventListener("click", hideNameOverlay);
document.getElementById("nameSaveBtn").addEventListener("click", () => {
  const val = document.getElementById("nameInput").value.trim();
  if (!val) return;
  myName = val;
  localStorage.setItem("rollcall-name", myName);
  updateNameChip();
  hideNameOverlay();
  renderDayPanel();
});
document.getElementById("nameInput").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("nameSaveBtn").click();
});

document.getElementById("prevMonth").addEventListener("click", () => {
  viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()-1, 1);
  renderCalendar();
});
document.getElementById("nextMonth").addEventListener("click", () => {
  viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()+1, 1);
  renderCalendar();
});

document.getElementById("newEventBtn").addEventListener("click", () => {
  document.getElementById("formTitle").value = "";
  document.getElementById("formTime").value = "";
  document.getElementById("formRepeat").checked = false;
  document.getElementById("formUntilWrap").style.display = "none";
  document.getElementById("formUntil").value = "";
  document.getElementById("formOverlay").style.display = "flex";
});
document.getElementById("closeFormBtn").addEventListener("click", () => {
  document.getElementById("formOverlay").style.display = "none";
});
document.getElementById("formRepeat").addEventListener("change", (e) => {
  document.getElementById("formUntilWrap").style.display = e.target.checked ? "block" : "none";
});
document.getElementById("submitFormBtn").addEventListener("click", async () => {
  const title = document.getElementById("formTitle").value.trim();
  if (!title) return;
  const time = document.getElementById("formTime").value;
  const repeat = document.getElementById("formRepeat").checked;
  const until = document.getElementById("formUntil").value;

  const btn = document.getElementById("submitFormBtn");
  btn.disabled = true;
  btn.textContent = "Saving…";

  let dates = [selectedDate];
  const groupId = repeat ? `g-${Date.now()}` : null;
  if (repeat && until && until >= selectedDate){
    dates = generateWeeklyDates(selectedDate, until);
  }
  const newEvents = dates.map(d => ({ title, date: d, time, groupId }));
  try {
    await addEventsBatch(newEvents);
    document.getElementById("formOverlay").style.display = "none";
  } catch (e) {
    alert("Couldn't save the event. Check your connection and try again.");
  } finally {
    btn.disabled = false;
    btn.textContent = "Add to board";
  }
});

// --- Init ---
updateNameChip();
renderCalendar();
renderDayPanel();

if (SETUP_NEEDED){
  const banner = document.createElement("div");
  banner.className = "setup-banner";
  banner.innerHTML = "This app isn't connected to a database yet. Open index.html, find the <code>firebaseConfig</code> section near the bottom, and paste in your own Firebase project keys. See README.md for step-by-step instructions.";
  document.body.insertBefore(banner, document.querySelector(".panel"));
} else {
  loadEventsRealtime();
  if (!myName) showNameOverlay(false);
}
</script>
</body>
</html>
